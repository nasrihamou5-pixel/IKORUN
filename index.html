<!DOCTYPE html>

<script>
  // Anti-flash de thème : applique tout de suite (avant le premier paint, avant
  // même app.js) le mode/couleur/accent déjà connus, à partir d'un petit miroir
  // en clair (non sensible) posé par applyTheme() dans app.js. Sans ça, la page
  // peint d'abord le thème sombre par défaut du CSS, puis bascule en clair une
  // fois app.js chargé et le profil (chiffré, donc asynchrone) déchiffré — d'où
  // le flash noir/blanc aléatoire selon le thème réellement choisi par la personne.
  try{
    const tp = JSON.parse(localStorage.getItem('ik_theme_prefs') || 'null');
    if(tp){
      if(tp.mode === 'light') document.documentElement.setAttribute('data-mode', 'light');
      if(tp.accent) document.documentElement.setAttribute('data-accent', tp.accent);
      if(tp.easyMode) document.documentElement.classList.add('easy-mode');
      if(tp.easyMode && typeof tp.ez === 'string' && /^[a-z]{2,12}$/.test(tp.ez)) document.documentElement.setAttribute('data-ez', tp.ez);
      if(tp.glass === 'std' || tp.glass === 'max' || tp.glass === 'wrap') document.documentElement.setAttribute('data-glass', tp.glass);
      if(tp.glass === 'wrap' && typeof tp.wrap === 'string' && /^[a-z]{2,12}$/.test(tp.wrap)) document.documentElement.setAttribute('data-wrap', tp.wrap);
      // thème personnalisé (V3.14.0, voir txApply dans app.js) : posé avant la première image.
      // Seules des déclarations de variables CSS sont acceptées (ni balise, ni url, ni @).
      if(typeof tp.css==='string' && tp.css.length<8000 && /^html:not\(#ik-tx\):not\(#ik-tx2\)\{[-\w\s:;#,.()%]*\}html:not\(#ik-tx\):not\(#ik-tx2\)\[data-mode="light"\]\{[-\w\s:;#,.()%]*\}$/.test(tp.css)){
        var st=document.createElement('style'); st.id='ikTx'; st.textContent=tp.css; document.head.appendChild(st); document.documentElement.setAttribute('data-tx','1');
      }
      // V4.0.0 : la fête du jour (Ramadan tout le mois…) avant la première image, le jour même seulement
      if(typeof tp.fete==='string' && /^[a-zA-Z]{2,12}$/.test(tp.fete) && tp.feteDay===(function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })()) document.documentElement.setAttribute('data-fete', tp.fete);
      // couleurs de l'intro (voir <style id="ikiCss">), le temps qu'app.css se charge
      if(tp.iki) ['e','e2','er','bg','mu'].forEach(function(k){ var v=tp.iki[k];
        if(typeof v==='string' && /^[#\w\s,.()%-]{1,48}$/.test(v)) document.documentElement.style.setProperty('--iki-'+k, v); });
    }
  }catch(e){}
  window.__rawEntryUrl = location.href;
  // Filet de sécurité : si l'URL contient un "##" résiduel (icône PWA déjà
  // "polluée" par un ancien essai de connexion Google), on le nettoie avant
  // que quoi que ce soit ne lise l'URL, pour éviter que ça bloque le prochain
  // vrai retour de connexion.
  if(location.href.includes('##')){
    const fixed = location.href.replace('##', '#');
    history.replaceState(null, '', fixed);
  }
  // Service Worker : nécessaire pour l'installabilité PWA (reste l'unique
  // cible de distribution pour l'instant — pas de TWA/Play Store en vue).
  // Un ancien SW buggé (Blob URL) avait causé un problème
  // de cache zombie sur iOS — d'où l'ancien kill-switch qui désinstallait
  // systématiquement tout SW. Depuis le 27/09, sw.js sert l'app depuis le
  // téléphone (elle s'ouvre sans connexion) et télécharge la nouvelle version
  // en arrière-plan, qui s'affiche au lancement suivant ou via le bandeau
  // « mise à jour » : pas de version figée. Pour forcer une purge totale après
  // un futur déploiement problématique, il suffit d'incrémenter C dans sw.js.
  // UNE APP NE ZOOME PAS (v109) : iOS ignore user-scalable=no depuis iOS 10 — le pincement
  // agrandissait toute l'interface. On bloque donc aussi ses évènements de geste (pincer),
  // et touch-action (CSS) coupe le double-toucher et le pincement sur les autres navigateurs.
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){ document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false}); });
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
    // sw.js affiche la page enregistrée tout de suite et télécharge la nouvelle en
    // arrière-plan ; s'il y en a une, il envoie 'ik-maj'. Écouté dès maintenant (le
    // message peut arriver avant app.js) ; app.js affiche alors le bandeau.
    navigator.serviceWorker.addEventListener('message', ev => {
      if(ev.data && ev.data.type === 'ik-maj'){ window.__ikMaj = true; try{ window.dispatchEvent(new Event('ik-maj')); }catch(e){} }
    });
    try{ navigator.serviceWorker.startMessages(); }catch(e){}
  }
</script>

<!-- ============ CSP ============
     Verrouille les origines autorisées à charger un script, se connecter en
     réseau, afficher une image, etc. Limites de ce mécanisme, à connaître :
     - script-src / style-src doivent inclure 'unsafe-inline' car l'app repose
       massivement sur des attributs onclick="..." et style="..." générés en JS
       (des milliers d'occurrences) : les enlever demanderait une refonte à part
       (délégation d'événements + classes CSS) qu'on peut faire dans un second
       temps. Tant que 'unsafe-inline' est présent sur script-src, une XSS qui
       parviendrait à injecter du HTML pourrait toujours exécuter du JS — cette
       CSP bloque en revanche le chargement de script/domaines non prévus,
       l'exfiltration réseau vers un domaine tiers, les <object>/<embed>, et le
       détournement de <base>.
     - frame-ancestors (anti-clickjacking) est IGNORÉ quand la CSP est posée via
       une balise <meta> comme ici : les navigateurs n'appliquent cette directive
       que si elle vient d'un header HTTP. Si l'hébergeur le permet (Netlify,
       Vercel, Cloudflare Pages...), ajoute côté serveur :
       Content-Security-Policy: frame-ancestors 'self'
  -->

   l'écran, les deux lames arrivent en diagonale et s'emboîtent, puis les lettres
   IKO / RUN se posent. Version complète à la toute première ouverture, version

      '<linearGradient id="ikiW" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--iki-w2)"/><stop offset="1" style="stop-color:var(--iki-w1)"/></linearGradient>'+

      '<div class="iki-mark">'+blade('iki-g2',B,'ikiB')+blade('iki-g1',W,'ikiW')+blade('iki-b2',B,'ikiB')+blade('iki-b1',W,'ikiW')+'</div>'+
      '<div class="iki-ring"></div>'+
      '<div class="iki-word"><span>I</span><span>K</span><span>O</span><span class="r">R</span><span class="r">U</span><span class="r">N</span></div>'+
      '<div class="iki-line"></div><div class="iki-tag">Elite Athletic Intelligence</div></div>';

    // V3.5.5 : l'intro ne s'arrête plus à heure fixe. Elle dure au moins le temps de se

    // par app.js une fois le premier écran dessiné) en « respirant » (.wait) — au lieu de
    // laisser place au squelette sombre. Plafond de 7 s, et un appui la passe toujours.
    var done=false, t0=Date.now(), comp=reduce?0:(mode==='full'?2450:1500), minT=reduce?650:(mode==='full'?3300:1900);
    var tWait=setTimeout(function(){ el.classList.add('wait'); }, comp);
    function tryEnd(){ if(window.__ikReady && Date.now()-t0>=minT) end(false); }
    window.addEventListener('ik-ready',function(){ setTimeout(tryEnd, Math.max(0, minT-(Date.now()-t0))); });
    var cap=setTimeout(function(){ end(false); }, 7000);
    function end(fast){
      if(done) return; done=true; clearTimeout(timer); clearTimeout(tWait); clearTimeout(cap);
      // V3.14.0 : sur un formulaire (connexion, inscription), le logo restait visible à travers
      // les champs pendant le fondu de 0,6 s. Il disparaît d'un coup, le fond s'efface en
      // 0,2 s, et le formulaire ne reçoit les appuis qu'une fois l'intro retirée.
      var form=document.querySelector('#login.on,#ob.on'), quick=fast||!!form;
      if(quick) el.classList.add('out-fast');
      if(form) form.inert=true;
      el.classList.add('out');
      try{ window.dispatchEvent(new Event('ik-intro-end')); }catch(e){} // app.js rejoue l'entrée de l'écran révélé
      setTimeout(function(){ el.remove(); if(form) form.inert=false; }, quick?220:640);
    }
    var timer=setTimeout(tryEnd, minT);
    el.addEventListener('pointerdown',function(){ end(true); });
  }
  window.ikIntro=ikIntro;
  var seen=false; try{ seen=localStorage.getItem('ik_intro_v1')==='1'; localStorage.setItem('ik_intro_v1','1'); }catch(e){}
  ikIntro(seen?'mini':'full');
})();
</script>

<!-- Auto-hébergé (vendor/supabase.js, build 2.110.8, bit-identique au fichier jsdelivr
     — vérifié par hash avant intégration) au lieu de charger depuis jsdelivr.net :
     la description de l'app promet "100% hors-ligne", mais un script tiers chargé
     depuis un CDN n'est jamais mis en cache par le service worker (sw.js ne gère
     que les requêtes same-origin, voir son commentaire), donc hors-ligne — ou sur
     un réseau qui bloque jsdelivr, ce qui arrive — le script ne chargeait jamais
     et window.supabaseClient restait indéfini sans que personne ne le voie. En
     same-origin, le SW le met en cache comme app.js et l'app redémarre offline.
     Pour mettre à jour la version : retélécharger le fichier UMD correspondant
     depuis jsdelivr et l'écraser dans vendor/supabase.js. -->
<!-- CHARGEMENT APRÈS LA PREMIÈRE IMAGE (26/09) — « écran noir avant l'intro ».
     Même en defer, Chrome lit et exécute les scripts (~1,3 Mo) AVANT de dessiner la
     première image : sur téléphone, 0,5 à 1,5 s d'écran noir, puis l'intro. Les
     scripts sont désormais ajoutés juste après la première image (requestAnimationFrame
     puis setTimeout) : l'intro est déjà à l'écran pendant qu'ils s'exécutent.
     async=false garde l'ordre supabase → sb-init → app.js (→ smoke.js en autotest).
     app.js démarre seul même si DOMContentLoaded est déjà passé (readyState).
     La suite de fumée (?selftest=1) partage l'environnement lexical d'app.js et
     ne persiste RIEN : elle photographie l'état, teste, restaure. -->
<script>
// V4.0.0 : modules chargés à la demande (ikLoad dans app.js) ; le service worker lit aussi ces
// adresses pour les garder hors ligne. Un ?v= par fichier, monté quand le fichier change.
window.IK_MOD={scene:'weather/scene.min.js?v=2',share:'share/share.min.js?v=2',races:'races/races.min.js?v=3',stats:'analytics/admin.min.js?v=1',method:'method/method.min.js?v=1',exdb:'exercises/exdb.min.js?v=2'};
</script>
<script>
(function(){
  // V3.14.0 : la liste vient des <link rel=preload as=script> du <head> — UN seul numéro
  // de version par fichier dans toute la page (avant : recopié ici, et un oubli faisait
  // précharger une version et exécuter une autre, donc deux téléchargements).
  var SCRIPTS = [].map.call(document.querySelectorAll('link[rel=preload][as=script]'), function(l){ return l.getAttribute('href'); });
  if (location.search.indexOf('selftest=1') > -1) SCRIPTS.push('tests/smoke.js?v=52');
  var lance = false;
  function charge(){
    if (lance) return; lance = true;
    SCRIPTS.forEach(function(src){
      var el = document.createElement('script');
      el.src = src; el.async = false;
      document.body.appendChild(el);
    });
  }
  // app.js dessine l'interface : il attend qu'app.css soit appliquée (elle ne bloque plus
  // la première image, voir <style id="ikiCss">). Filet de 4 s si elle n'arrivait pas.
  function apresCss(){
    var l=document.getElementById('ikCss');
    if(!l || (l.media==='all' && l.sheet)) return charge();
    l.addEventListener('load',function(){ l.media='all'; charge(); });
    l.addEventListener('error',charge);
    setTimeout(function(){ l.media='all'; charge(); }, 4000);
  }
  // double rAF : le 1er rappel précède la 1re image, le 2e la suit
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ setTimeout(apresCss, 0); }); });
  setTimeout(apresCss, 1000); // filet : page ouverte en arrière-plan (aucune image produite)
})();
</script>
